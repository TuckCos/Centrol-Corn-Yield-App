<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111418" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Centrol Yield Estimator</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root{--bg:#f4f6f8;--panel:#fff;--ink:#171b22;--muted:#6b7280;--line:#e4e7ec;--red:#d9242f;--red2:#b81922;--dark:#111418;--green:#23864a;--yellow:#d9a30f;--zoneRed:#c83a3a;--shadow:0 8px 30px rgba(16,24,40,.07);--radius:18px}
    *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif} button,input,select{font:inherit}
    button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:290px minmax(0,1fr)}
    aside{background:linear-gradient(180deg,#171b20 0,#0e1114 100%);color:#fff;padding:24px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:5}.logo{width:100%;max-width:250px;height:auto;display:block;margin:0 auto 24px}.nav-title{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#8f98a6;margin:12px 10px}.farm-list{overflow:auto;min-height:0;flex:1;padding-right:3px}.farm-btn{width:100%;border:1px solid transparent;background:transparent;color:#dce1e7;text-align:left;border-radius:13px;padding:12px 13px;margin:4px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.farm-btn:hover{background:#20262d}.farm-btn.active{background:#2a2023;border-color:#5e252a;color:#fff;box-shadow:inset 3px 0 0 var(--red)}.farm-name{font-weight:700}.farm-meta{font-size:12px;color:#9ea7b3}.side-actions{display:grid;gap:9px;padding-top:14px}.side-actions button{border:1px solid #343b44;background:#1b2026;color:#fff;border-radius:12px;padding:11px 12px}.side-actions button.primary{background:var(--red);border-color:var(--red)}
    main{min-width:0}.topbar{height:80px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 28px;position:sticky;top:0;z-index:4}.topbar h1{font-size:24px;margin:0;white-space:nowrap}.search{margin-left:auto;max-width:420px;width:40%;min-width:220px}.search input{width:100%;border:1px solid var(--line);background:#f7f8fa;border-radius:12px;padding:11px 13px;outline:none}.content{padding:26px 28px 42px;max-width:1500px;margin:auto}.hero{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}.hero h2{font-size:28px;margin:0 0 4px}.hero p{margin:0;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px;font-weight:700}.btn:hover{transform:translateY(-1px)}.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.danger{color:#b42318;border-color:#f2b8b5;background:#fff6f5}.btn.ghost{background:transparent}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:var(--shadow)}.stat .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.stat .value{font-size:25px;font-weight:800;margin-top:5px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}.panel-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;justify-content:space-between}.panel-head h3{margin:0;font-size:19px}.panel-head .sub{color:var(--muted);font-size:13px}.table-wrap{overflow:auto}.field-table{width:100%;border-collapse:collapse;min-width:720px}.field-table th,.field-table td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left}.field-table th{font-size:12px;color:#667085;background:#f8fafb;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}.field-table tr:last-child td{border-bottom:0}.field-table tbody tr{cursor:pointer}.field-table tbody tr:hover{background:#fafbfc}.field-table tbody tr.active{background:#fff1f1;box-shadow:inset 3px 0 0 var(--red)}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:#f2f4f7;font-size:12px;font-weight:700}.field-actions{display:flex;gap:8px}.iconbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field-info{padding:18px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.form-control label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 5px}.form-control input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none}.form-control input:focus,.sample input:focus{border-color:#e56b72;box-shadow:0 0 0 3px #ffe3e5}.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:18px}.zone{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#fbfcfd}.zone-head{padding:12px 13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.zone-title{font-weight:800;display:flex;align-items:center;gap:8px}.dot{width:10px;height:10px;border-radius:50%}.dot.green{background:var(--green)}.dot.yellow{background:var(--yellow)}.dot.red{background:var(--zoneRed)}.ear{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}.ear input{width:74px;border:1px solid var(--line);border-radius:8px;padding:6px 7px}.sample-head,.sample{display:grid;grid-template-columns:34px 1fr 1fr;gap:7px;align-items:center;padding:7px 10px}.sample-head{background:#f6f7f9;font-size:11px;color:var(--muted);font-weight:700}.sample{border-top:1px solid #eef0f2}.sample input{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 8px}.calc{padding:10px 12px 12px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}.calc div{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px}.calc small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.calc strong{display:block;font-size:16px;margin-top:2px}.results{padding:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.result{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fafbfc}.result small{display:block;color:var(--muted);text-transform:uppercase;font-size:10px}.result strong{display:block;font-size:21px;margin-top:4px}.empty{padding:48px;text-align:center;color:var(--muted)}.empty h3{color:var(--ink)}
    dialog{border:0;border-radius:18px;padding:0;max-width:520px;width:calc(100% - 28px);box-shadow:0 30px 90px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(8,12,17,.55);backdrop-filter:blur(3px)}.modal{padding:22px}.modal h3{margin:0 0 16px;font-size:22px}.modal-grid{display:grid;gap:12px}.modal label{font-size:12px;font-weight:700;color:var(--muted)}.modal input{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:10px;padding:10px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.toast{position:fixed;right:24px;bottom:24px;background:#1c2229;color:#fff;padding:11px 14px;border-radius:11px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:none}
    @media(max-width:1100px){.app{grid-template-columns:230px 1fr}.cards{grid-template-columns:repeat(2,1fr)}.zones{grid-template-columns:1fr}.editor-grid{grid-template-columns:1fr}.results{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:760px){.app{display:block}.app aside{height:auto;position:relative;padding:14px}.logo{max-width:190px;margin:0 0 10px}.nav-title,.farm-list{display:none}.side-actions{display:flex;padding:0;overflow:auto}.side-actions button{white-space:nowrap;flex:0 0 auto}.topbar{height:auto;min-height:66px;padding:11px 14px;flex-wrap:wrap}.topbar h1{font-size:20px}.search{order:3;width:100%;max-width:none;min-width:0}.content{padding:16px 14px 30px}.hero{align-items:flex-start}.hero h2{font-size:24px}.cards{grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:13px}.stat .value{font-size:20px}.form-grid{grid-template-columns:1fr 1fr}.zones{padding:12px}.results{padding:12px;grid-template-columns:1fr 1fr}.panel-head{padding:14px}.field-info{padding:14px}}
  </style>
</head>
<body>
<div class="app">
  <aside>
    <img class="logo" src="centrol-logo.png" alt="Centrol Ag Consulting" />
    <div class="nav-title">Farms</div>
    <div id="farmList" class="farm-list"></div>
    <div class="side-actions">
      <button class="primary" id="addFarmBtn">＋ Add farm</button>
      <button id="backupBtn">Export backup</button>
      <button id="importBtn">Import backup</button>
      <input id="importFile" type="file" accept="application/json" hidden />
    </div>
  </aside>
  <main>
    <header class="topbar">
      <h1>Yield Estimator</h1>
      <div class="search"><input id="searchInput" placeholder="Search fields…" /></div>
      <button class="btn primary" id="addFieldTop">＋ Add field</button>
    </header>
    <div class="content">
      <section class="hero">
        <div><h2 id="farmTitle">Farm</h2><p id="farmSub">Manage fields and corn yield estimates.</p></div>
        <button class="btn" id="editFarmBtn">Edit farm</button>
      </section>
      <section class="cards" id="stats"></section>
      <section class="panel">
        <div class="panel-head"><div><h3>Fields</h3><div class="sub">Tap a field to edit its yield estimate.</div></div><button class="btn primary" id="addFieldBtn">＋ Add field</button></div>
        <div class="table-wrap"><table class="field-table"><thead><tr><th>Field ID</th><th>Acres</th><th>Yield low</th><th>Yield high</th><th>Bushels low</th><th>Bushels high</th><th></th></tr></thead><tbody id="fieldRows"></tbody></table></div>
      </section>
      <div id="fieldEditor"></div>
    </div>
  </main>
</div>
<dialog id="farmDialog"><form method="dialog" class="modal" id="farmForm"><h3 id="farmDialogTitle">Add farm</h3><div class="modal-grid"><label>Farm name<input id="farmNameInput" required maxlength="80" placeholder="Example: Johnson Farms 2026" /></label></div><div class="modal-actions"><button class="btn" value="cancel">Cancel</button><button class="btn primary" value="default" id="saveFarmBtn">Save</button></div></form></dialog>
<dialog id="fieldDialog"><form method="dialog" class="modal" id="fieldForm"><h3 id="fieldDialogTitle">Add field</h3><div class="modal-grid"><label>Field ID / name<input id="fieldNameInput" required maxlength="80" placeholder="Example: North 80" /></label><label>Acres<input id="fieldAcresInput" type="number" min="0" step="0.01" placeholder="0" /></label></div><div class="modal-actions"><button class="btn" value="cancel">Cancel</button><button class="btn primary" value="default" id="saveFieldBtn">Save</button></div></form></dialog>
<div class="toast" id="toast">Saved</div>
<script>
const STORAGE='centrolYieldEstimator.v1';
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const blankZone=(ear=0)=>({earCount:ear,samples:Array.from({length:5},()=>({length:0,round:0}))});
const blankField=(name='New Field',acres=0)=>({id:uid(),name,acres:Number(acres)||0,zones:{green:blankZone(),yellow:blankZone(),red:blankZone()}});
const seed={version:1,selectedFarmId:'farm-schrute',selectedFieldId:'field-a1-1',farms:[{id:'farm-schrute',name:'SCHRUTE FARMS 2025',fields:[
 {id:'field-a1-1',name:'SCH-A1-1',acres:171,zones:{green:{earCount:28,samples:[{length:34,round:18},{length:37,round:18},{length:40,round:18},{length:38,round:16},{length:39,round:16}]},yellow:{earCount:28,samples:[{length:35,round:18},{length:40,round:14},{length:38,round:18},{length:32,round:20},{length:38,round:16}]},red:{earCount:28,samples:[{length:41,round:14},{length:24,round:16},{length:35,round:16},{length:37,round:16},{length:28,round:14}]}}},
 {id:'field-a1-2',name:'SCH-A1-2',acres:54,zones:{green:{earCount:28,samples:[{length:34,round:14},{length:34,round:16},{length:32,round:16},{length:34,round:20},{length:36,round:16}]},yellow:{earCount:26,samples:[{length:29,round:18},{length:29,round:16},{length:33,round:18},{length:37,round:16},{length:38,round:18}]},red:{earCount:27,samples:[{length:34,round:16},{length:30,round:20},{length:32,round:16},{length:31,round:16},{length:27,round:18}]}}}
]}]};
let state=load(); let farmMode='add',fieldMode='add'; let editingFarmId=null,editingFieldId=null;
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE));return x&&x.farms?x:structuredClone(seed)}catch{return structuredClone(seed)}}
function save(msg='Saved'){localStorage.setItem(STORAGE,JSON.stringify(state));showToast(msg)}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),900)}
function num(v){v=Number(v);return Number.isFinite(v)?v:0} function avg(a){const vals=a.map(num);return vals.length?vals.reduce((x,y)=>x+y,0)/vals.length:0} function fmt(n,d=0){return num(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})}
function calcZone(z){const l=avg(z.samples.map(s=>s.length)),r=avg(z.samples.map(s=>s.round));return{avgLength:l,avgRound:r,low:num(z.earCount)*l*r/100,high:num(z.earCount)*l*r/90}}
function calcField(f){const zs=['green','yellow','red'].map(k=>calcZone(f.zones[k]));const low=avg(zs.map(z=>z.low)),high=avg(zs.map(z=>z.high));return{zones:zs,low,high,bushelsLow:low*num(f.acres),bushelsHigh:high*num(f.acres)}}
function getFarm(){return state.farms.find(f=>f.id===state.selectedFarmId)||state.farms[0]} function getField(){const f=getFarm();return f?.fields.find(x=>x.id===state.selectedFieldId)||f?.fields[0]}
function ensureSelection(){if(!state.farms.length){const f={id:uid(),name:'My Farm',fields:[]};state.farms=[f];state.selectedFarmId=f.id;state.selectedFieldId=null}let farm=getFarm();if(!farm){state.selectedFarmId=state.farms[0].id;farm=state.farms[0]}if(!farm.fields.some(f=>f.id===state.selectedFieldId)) state.selectedFieldId=farm.fields[0]?.id||null}
function render(){ensureSelection();const farm=getFarm(),field=getField();document.getElementById('farmTitle').textContent=farm.name;document.getElementById('farmSub').textContent=`${farm.fields.length} field${farm.fields.length===1?'':'s'} • data saves on this device`;renderFarmList();renderStats();renderFields();renderEditor(field)}
function renderFarmList(){const el=document.getElementById('farmList');el.innerHTML='';state.farms.forEach(f=>{const b=document.createElement('button');b.className='farm-btn'+(f.id===state.selectedFarmId?' active':'');b.innerHTML=`<span><span class="farm-name">${esc(f.name)}</span><br><span class="farm-meta">${f.fields.length} fields</span></span><span>›</span>`;b.onclick=()=>{state.selectedFarmId=f.id;state.selectedFieldId=f.fields[0]?.id||null;save();render()};el.appendChild(b)})}
function renderStats(){const farm=getFarm(),cs=farm.fields.map(calcField);const acres=farm.fields.reduce((s,f)=>s+num(f.acres),0),low=cs.reduce((s,c)=>s+c.bushelsLow,0),high=cs.reduce((s,c)=>s+c.bushelsHigh,0),avgLow=cs.length?avg(cs.map(c=>c.low)):0,avgHigh=cs.length?avg(cs.map(c=>c.high)):0;document.getElementById('stats').innerHTML=[['Total acres',fmt(acres,1)],['Farm bushels low',fmt(low)],['Farm bushels high',fmt(high)],['Avg yield range',`${fmt(avgLow)}–${fmt(avgHigh)} bu/ac`]].map(x=>`<div class="stat"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}
function renderFields(){const q=document.getElementById('searchInput').value.trim().toLowerCase(),farm=getFarm(),body=document.getElementById('fieldRows');body.innerHTML='';farm.fields.filter(f=>!q||f.name.toLowerCase().includes(q)).forEach(f=>{const c=calcField(f),tr=document.createElement('tr');if(f.id===state.selectedFieldId)tr.classList.add('active');tr.innerHTML=`<td><strong>${esc(f.name)}</strong></td><td>${fmt(f.acres,1)}</td><td>${fmt(c.low)} bu/ac</td><td>${fmt(c.high)} bu/ac</td><td>${fmt(c.bushelsLow)}</td><td>${fmt(c.bushelsHigh)}</td><td><div class="field-actions"><button class="iconbtn edit-field" title="Edit field">✎</button><button class="iconbtn delete-field" title="Delete field">🗑</button></div></td>`;tr.onclick=()=>{state.selectedFieldId=f.id;save();render()};tr.querySelector('.edit-field').onclick=e=>{e.stopPropagation();openFieldDialog('edit',f)};tr.querySelector('.delete-field').onclick=e=>{e.stopPropagation();deleteField(f.id)};body.appendChild(tr)});if(!farm.fields.length)body.innerHTML='<tr><td colspan="7" class="empty">No fields yet. Add your first field.</td></tr>'}
function renderEditor(field){const host=document.getElementById('fieldEditor');if(!field){host.innerHTML='<section class="panel empty"><h3>No field selected</h3><p>Add a field to begin a corn yield estimate.</p></section>';return}const c=calcField(field);host.innerHTML=`<section class="panel"><div class="panel-head"><div><h3>${esc(field.name)}</h3><div class="sub">Edit values just like the Excel sheet. Calculations update instantly.</div></div><div class="field-actions"><button class="btn" id="editSelectedField">Edit field</button><button class="btn danger" id="deleteSelectedField">Delete</button></div></div><div class="field-info"><div class="form-grid"><div class="form-control"><label>Field ID / name</label><input data-field-prop="name" value="${attr(field.name)}"></div><div class="form-control"><label>Field acres</label><input type="number" min="0" step="0.01" data-field-prop="acres" value="${field.acres}"></div><div class="form-control"><label>Formula basis</label><input value="3 zones • /100 low • /90 high" disabled></div></div></div><div class="zones">${['green','yellow','red'].map((k,i)=>zoneHtml(k,field.zones[k],c.zones[i])).join('')}</div><div class="results"><div class="result"><small>Yield low</small><strong>${fmt(c.low)} bu/ac</strong></div><div class="result"><small>Yield high</small><strong>${fmt(c.high)} bu/ac</strong></div><div class="result"><small>Bushels low</small><strong>${fmt(c.bushelsLow)}</strong></div><div class="result"><small>Bushels high</small><strong>${fmt(c.bushelsHigh)}</strong></div></div></section>`;
 host.querySelectorAll('[data-field-prop]').forEach(i=>i.oninput=()=>{if(i.dataset.fieldProp==='name')field.name=i.value;else field.acres=num(i.value);save();renderStats();renderFields();updateResultsOnly()});host.querySelectorAll('[data-zone-ear]').forEach(i=>i.onchange=()=>{field.zones[i.dataset.zoneEar].earCount=num(i.value);save();renderStats();renderFields();renderEditor(field)});host.querySelectorAll('[data-sample]').forEach(i=>i.onchange=()=>{const [z,idx,p]=i.dataset.sample.split('|');field.zones[z].samples[Number(idx)][p]=num(i.value);save();renderStats();renderFields();renderEditor(field)});document.getElementById('editSelectedField').onclick=()=>openFieldDialog('edit',field);document.getElementById('deleteSelectedField').onclick=()=>deleteField(field.id)}
function updateResultsOnly(){}
function zoneHtml(k,z,c){const label=k[0].toUpperCase()+k.slice(1);return`<div class="zone"><div class="zone-head"><div class="zone-title"><span class="dot ${k}"></span>${label}</div><div class="ear">Ear count / 26 ft <input type="number" min="0" step="1" data-zone-ear="${k}" value="${z.earCount}"></div></div><div class="sample-head"><span>#</span><span>Length</span><span>Round</span></div>${z.samples.map((s,i)=>`<div class="sample"><span>${i+1}</span><input type="number" min="0" step="0.1" data-sample="${k}|${i}|length" value="${s.length}"><input type="number" min="0" step="0.1" data-sample="${k}|${i}|round" value="${s.round}"></div>`).join('')}<div class="calc"><div><small>Avg length</small><strong>${fmt(c.avgLength,1)}</strong></div><div><small>Avg round</small><strong>${fmt(c.avgRound,1)}</strong></div><div><small>Low /100</small><strong>${fmt(c.low)}</strong></div><div><small>High /90</small><strong>${fmt(c.high)}</strong></div></div></div>`}
function openFarmDialog(mode){farmMode=mode;const f=getFarm();editingFarmId=mode==='edit'?f.id:null;document.getElementById('farmDialogTitle').textContent=mode==='edit'?'Edit farm':'Add farm';document.getElementById('farmNameInput').value=mode==='edit'?f.name:'';document.getElementById('farmDialog').showModal();setTimeout(()=>document.getElementById('farmNameInput').focus(),50)}
function openFieldDialog(mode,f=null){fieldMode=mode;f=f||getField();editingFieldId=mode==='edit'?f?.id:null;document.getElementById('fieldDialogTitle').textContent=mode==='edit'?'Edit field':'Add field';document.getElementById('fieldNameInput').value=mode==='edit'&&f?f.name:'';document.getElementById('fieldAcresInput').value=mode==='edit'&&f?f.acres:'';document.getElementById('fieldDialog').showModal();setTimeout(()=>document.getElementById('fieldNameInput').focus(),50)}
function deleteField(id){const farm=getFarm(),f=farm.fields.find(x=>x.id===id);if(!f||!confirm(`Delete ${f.name}?`))return;farm.fields=farm.fields.filter(x=>x.id!==id);state.selectedFieldId=farm.fields[0]?.id||null;save('Field deleted');render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(s){return esc(s)}
document.getElementById('addFarmBtn').onclick=()=>openFarmDialog('add');document.getElementById('editFarmBtn').onclick=()=>openFarmDialog('edit');document.getElementById('addFieldBtn').onclick=()=>openFieldDialog('add');document.getElementById('addFieldTop').onclick=()=>openFieldDialog('add');document.getElementById('searchInput').oninput=renderFields;
document.getElementById('farmForm').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('farmNameInput').value.trim();if(!name)return;if(farmMode==='add'){const f={id:uid(),name,fields:[]};state.farms.push(f);state.selectedFarmId=f.id;state.selectedFieldId=null}else{const f=state.farms.find(x=>x.id===editingFarmId);if(f)f.name=name}document.getElementById('farmDialog').close();save();render()});
document.getElementById('fieldForm').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('fieldNameInput').value.trim();if(!name)return;const acres=num(document.getElementById('fieldAcresInput').value),farm=getFarm();if(fieldMode==='add'){const f=blankField(name,acres);farm.fields.push(f);state.selectedFieldId=f.id}else{const f=farm.fields.find(x=>x.id===editingFieldId);if(f){f.name=name;f.acres=acres}}document.getElementById('fieldDialog').close();save();render()});
document.getElementById('backupBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='centrol-yield-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const x=JSON.parse(await file.text());if(!x.farms)throw new Error();if(confirm('Replace current app data with this backup?')){state=x;save('Backup imported');render()}}catch{alert('That backup file could not be read.')}e.target.value=''};
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');render();
</script>
</body>
</html>
